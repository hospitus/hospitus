name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # The v6 action resolves "latest" within the v1 series, which ended
          # at 1.64.x — all built with Go 1.24, so they refuse a go.mod
          # targeting 1.25 before reading a line of source. Pin the version
          # that matches .golangci.yml's v2 format.
          version: v2.13.1
          args: --timeout=5m

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install QEMU
        run: brew install qemu || true

      - name: Run tests
        run: go test -v ./...

  test-freebsd:
    name: Test (FreeBSD ${{ matrix.release }})
    # FreeBSD is the primary platform: jails and bhyve are kernel features that
    # exist nowhere else, and much of the tree sits behind a freebsd build tag.
    # A green Linux and macOS run says nothing about it. GitHub has no FreeBSD
    # runner, so the tests run in a VM on the Linux one.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest branch the project claims to support and the newest
        # release. 14.x and 15.x differ in ways Hospitus touches directly — pkg's
        # repository naming and the jail parameters accepted by jail(8).
        release: ["14.3", "15.1"]
    steps:
      - uses: actions/checkout@v7

      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: |
            # A quarterly package can carry a higher __FreeBSD_version than the
            # release image, and pkg then stops to ask a question no CI can
            # answer. Same guard poudriere uses.
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            env IGNORE_OSVERSION=yes pkg update -f
            env IGNORE_OSVERSION=yes pkg install -y go git
          run: |
            set -e
            go version
            # The checkout is copied into the VM under another owner, so git
            # refuses to describe it and go build fails with "error obtaining
            # VCS status". The Makefile already builds with -buildvcs=false.
            export GOFLAGS=-buildvcs=false
            go build -v ./...
            go vet ./...
            # -short only: the integration suite wants root, a ZFS pool and
            # several minutes. That is the job below.
            go test -short ./...

  integration-freebsd:
    name: Integration (FreeBSD)
    # The only place jails actually run. ZFS comes from a file-backed vdev, so
    # no pool on the runner is needed and nothing outside it is touched. bhyve
    # stays out: it needs hardware virtualisation the VM does not have.
    runs-on: ubuntu-latest
    needs: test-freebsd
    steps:
      - uses: actions/checkout@v7

      - name: Integration tests in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          copyback: false
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            env IGNORE_OSVERSION=yes pkg update -f
            env IGNORE_OSVERSION=yes pkg install -y go git
          run: |
            set -e
            kldload zfs || true
            truncate -s 8G /var/tmp/hospitus-ci-pool.img
            zpool create hospitusci /var/tmp/hospitus-ci-pool.img
            zfs create hospitusci/hospitus
            HOSPITUS_ZFS_PARENT=hospitusci/hospitus go test -v -timeout 40m ./test/integration/...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos, test-freebsd]
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, freebsd]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Only the CLI. The daemon links go-sqlite3, which needs cgo: built with
      # CGO_ENABLED=0 it starts and then dies on its first query, so a
      # cross-built hospitusd is worse than no artifact at all. It is built
      # natively by the per-platform test jobs above.
      - name: Build the CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/hospitus-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/hospitus-cli

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hospitus-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
