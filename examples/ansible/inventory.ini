# Ansible Inventory for Hospitus VMs
#
# This inventory file works with VMs created by Hospitus manifests.
# SSH ports are mapped through the host, so we connect to localhost.
#
# Usage:
#   ansible-playbook -i inventory.ini site.yml

[webservers]
ansible-target ansible_host=127.0.0.1 ansible_port=2270 ansible_user=ansible

[databases]
# db-server ansible_host=127.0.0.1 ansible_port=2271 ansible_user=ansible

[all:vars]
ansible_python_interpreter=/usr/bin/python3
# accept-new trusts a host the first time and refuses it if the key changes
# afterwards, which is what you want against a VM you just created. The
# previous default, StrictHostKeyChecking=no with a throwaway known_hosts,
# accepted a different key on every run and so detected nothing.
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

# For a lab where VMs are destroyed and recreated under the same port, and the
# key change is expected every time:
# ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
