# Ansible Inventory for Hospitus VMs
#
# This inventory file works with VMs created by Hospitus manifests.
# SSH ports are mapped through the host, so we connect to localhost.
#
# Usage:
#   ansible-playbook -i inventory.ini site.yml

[webservers]
ansible-target ansible_host=127.0.0.1 ansible_port=2270 ansible_user=ansible

[databases]
# db-server ansible_host=127.0.0.1 ansible_port=2271 ansible_user=ansible

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# For production, use proper host key verification:
# ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
